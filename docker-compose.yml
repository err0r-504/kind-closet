services:
  postgres:
    image: postgres:16-alpine
    container_name: kind-closet-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kind_closet_db}
      POSTGRES_USER: ${POSTGRES_USER:-kind_closet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kind_closet_admin} -d $${POSTGRES_DB:-kind_closet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kind-closet-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  # SeaweedFS All-in-One сервер со включенным S3 API
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: kind-closet-s3
    restart: always
    ports:
      - "8333:8333" # Порт S3 API
      - "9333:9333" # Порт Master (Web UI статистики)
    command: "server -dir=/data -s3"
    volumes:
      - s3_data:/data

  # Инициализация бакета через официальный AWS CLI
  s3-init:
    image: amazon/aws-cli:latest
    container_name: kind-closet-s3-init
    depends_on:
      - s3
    environment:
      # В SeaweedFS по умолчанию авторизация локально не строгая, но AWS CLI требует наличия любых непустых ключей
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-test-access-key}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-test-secret-key}
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url=http://s3:8333 s3 ls; do echo 'Ожидание SeaweedFS S3...'; sleep 2; done;
      aws --endpoint-url=http://s3:8333 s3 mb s3://$${S3_BUCKET_NAME:-kind-closet-images} || true;
      aws --endpoint-url=http://s3:8333 s3api put-bucket-acl --bucket $${S3_BUCKET_NAME:-kind-closet-images} --acl public-read;
      echo 'Бакет $${S3_BUCKET_NAME:-kind-closet-images} готов!';
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  s3_data: